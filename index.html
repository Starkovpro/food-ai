<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нейро Шеф Повар</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F5C800;
      --yellow-dark: #D4A900;
      --yellow-light: #FFF5B8;
      --black: #0F0F0F;
      --black2: #1A1A1A;
      --black3: #242424;
      --black4: #2E2E2E;
      --gray: #888880;
      --gray2: #555550;
      --white: #FFFFFF;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .app {
      max-width: 680px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--black4);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: var(--yellow);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--white);
    }

    .header h1 span {
      color: var(--yellow);
    }

    .header p {
      font-size: 14px;
      color: var(--gray);
      margin-top: 6px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: var(--black2);
      padding: 4px;
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      border: 1px solid var(--black4);
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: var(--gray);
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--yellow);
      color: var(--black);
      font-weight: 600;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .upload-zone {
      border: 1.5px dashed var(--black4);
      border-radius: var(--radius);
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      background: var(--black2);
      transition: all 0.2s;
    }

    .upload-zone:hover {
      border-color: var(--yellow);
      background: var(--black3);
    }

    .upload-zone input { display: none; }
    .upload-icon { font-size: 40px; margin-bottom: 12px; display: block; }

    .upload-zone p {
      font-size: 15px;
      color: var(--white);
      font-weight: 500;
    }

    .upload-zone span {
      font-size: 13px;
      color: var(--gray);
      display: block;
      margin-top: 4px;
    }

    .preview-wrap {
      position: relative;
      margin-top: 1rem;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--black4);
    }

    .preview-wrap img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      display: block;
    }

    .remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15,15,15,0.85);
      border: 1px solid var(--black4);
      color: var(--gray);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn {
      width: 100%;
      margin-top: 1rem;
      padding: 13px;
      background: var(--yellow);
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      color: var(--black);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover { background: var(--yellow-dark); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .result-card {
      margin-top: 1rem;
      background: var(--black2);
      border: 1px solid var(--black4);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .result-card h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--black3);
      border: 1px solid var(--black4);
      color: var(--gray);
      border-radius: var(--radius-sm);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    .copy-btn.copied {
      border-color: #3b6d11;
      color: #97c459;
      background: #1a2a0a;
    }

    .kcal-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--yellow);
      color: var(--black);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .result-text {
      font-size: 14px;
      color: #b0b0a8;
      line-height: 1.75;
      white-space: pre-wrap;
    }

    .ingredients-label {
      font-size: 14px;
      color: var(--gray);
      margin-bottom: 8px;
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 14px;
      font-size: 14px;
      border: 1.5px solid var(--black4);
      border-radius: var(--radius);
      resize: vertical;
      background: var(--black2);
      color: var(--white);
      font-family: inherit;
      line-height: 1.6;
      transition: border-color 0.2s;
    }

    textarea::placeholder { color: var(--gray2); }

    textarea:focus {
      outline: none;
      border-color: var(--yellow);
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 0;
      color: var(--gray);
      font-size: 14px;
    }

    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--yellow);
      animation: bounce 1.2s infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-7px); }
    }

    .error-msg {
      font-size: 13px;
      margin-top: 10px;
      padding: 10px 14px;
      background: #2a0a0a;
      border: 1px solid #501313;
      color: #f09595;
      border-radius: var(--radius-sm);
    }

    .frau-tag {
      display: inline-block;
      background: var(--black3);
      border: 1px solid var(--black4);
      color: var(--gray);
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .header h1 { font-size: 20px; }
      .tab { font-size: 13px; padding: 9px 6px; }
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">
      <div class="logo-icon">👨‍🍳</div>
      <h1><span>Нейро</span> Шеф Повар</h1>
    </div>
    <p>Считает калории по фото и придумывает рецепты из того, что есть дома</p>
    <span class="frau-tag">Фрау Фитнес</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('calories')">📷 Калории по фото</button>
    <button class="tab" onclick="switchTab('recipe')">🛒 Рецепт из продуктов</button>
  </div>

  <!-- CALORIES TAB -->
  <div id="panel-calories" class="panel active">
    <div class="upload-zone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])">
      <span class="upload-icon">📷</span>
      <p>Загрузите фото блюда</p>
      <span>JPG, PNG, WEBP — нажмите или перетащите файл</span>
    </div>

    <div id="preview-wrap" class="preview-wrap" style="display:none">
      <img id="preview-img" src="" alt="Preview">
      <button class="remove-btn" onclick="removeImage()">✕ Удалить</button>
    </div>

    <div id="weight-wrap" style="display:none; margin-top: 1rem;">
      <label class="ingredients-label" for="weight">Вес блюда (необязательно, но повысит точность):</label>
      <div style="display: flex; align-items: center; gap: 10px;">
        <input type="number" id="weight" min="1" max="9999" placeholder="Например: 350"
          style="flex:1; padding: 12px 14px; font-size: 15px; border: 1.5px solid var(--black4); border-radius: var(--radius); background: var(--black2); color: var(--white); font-family: inherit; outline: none; transition: border-color 0.2s;"
          onfocus="this.style.borderColor='var(--yellow)'" onblur="this.style.borderColor='var(--black4)'">
        <span style="font-size: 15px; color: var(--gray); white-space: nowrap;">г (граммы)</span>
      </div>
    </div>

    <button class="btn" id="btn-cal" onclick="analyzeCalories()" disabled>Подсчитать калории</button>

    <div id="cal-loader" class="loader" style="display:none">
      <div class="dots"><span></span><span></span><span></span></div>
      Анализирую фото...
    </div>

    <div id="cal-result" style="display:none" class="result-card">
      <div class="result-header">
        <h3>Результат анализа</h3>
        <button class="copy-btn" onclick="copyText('cal-text', this)">📋 Скопировать</button>
      </div>
      <div id="cal-badge"></div>
      <div class="result-text" id="cal-text"></div>
    </div>

    <div id="cal-error" class="error-msg" style="display:none"></div>
  </div>

  <!-- RECIPE TAB -->
  <div id="panel-recipe" class="panel">
    <span class="ingredients-label">Перечислите продукты, которые есть у вас:</span>
    <textarea id="ingredients" placeholder="Например: яйца, картошка, лук, морковь, сметана, укроп, сливочное масло..."></textarea>

    <button class="btn" id="btn-rec" onclick="getRecipe()">Найти рецепт</button>

    <div id="rec-loader" class="loader" style="display:none">
      <div class="dots"><span></span><span></span><span></span></div>
      Подбираю рецепт...
    </div>

    <div id="rec-result" style="display:none" class="result-card">
      <div class="result-header">
        <h3>Рецепт</h3>
        <button class="copy-btn" onclick="copyText('rec-text', this)">📋 Скопировать</button>
      </div>
      <div class="result-text" id="rec-text"></div>
    </div>

    <div id="rec-error" class="error-msg" style="display:none"></div>
  </div>
</div>

<script>
  let imageBase64 = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) =>
      t.classList.toggle('active', (i === 0 && tab === 'calories') || (i === 1 && tab === 'recipe'))
    );
    document.getElementById('panel-calories').classList.toggle('active', tab === 'calories');
    document.getElementById('panel-recipe').classList.toggle('active', tab === 'recipe');
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const result = e.target.result;
      imageBase64 = result.split(',')[1];
      document.getElementById('preview-img').src = result;
      document.getElementById('preview-wrap').style.display = 'block';
      document.getElementById('dropzone').style.display = 'none';
      document.getElementById('btn-cal').disabled = false;
      document.getElementById('weight-wrap').style.display = 'block';
      document.getElementById('cal-result').style.display = 'none';
      document.getElementById('cal-error').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  function removeImage() {
    imageBase64 = null;
    document.getElementById('weight-wrap').style.display = 'none';
    document.getElementById('preview-wrap').style.display = 'none';
    document.getElementById('dropzone').style.display = 'block';
    document.getElementById('btn-cal').disabled = true;
    document.getElementById('fileInput').value = '';
    document.getElementById('cal-result').style.display = 'none';
  }

  const dropzone = document.getElementById('dropzone');
  dropzone.addEventListener('dragover', e => { e.preventDefault(); });
  dropzone.addEventListener('drop', e => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); });

  function copyText(id, btn) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Скопировано!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '📋 Скопировать';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  async function analyzeCalories() {
    if (!imageBase64) return;
    document.getElementById('btn-cal').disabled = true;
    document.getElementById('cal-loader').style.display = 'flex';
    document.getElementById('cal-result').style.display = 'none';
    document.getElementById('cal-error').style.display = 'none';

    try {
      const weight = document.getElementById('weight').value;
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'calories', imageBase64, weight })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка сервера');

      const text = data.text || '';
      const kcalMatch = text.match(/ККАЛ:\s*(\d+)/i);
      const kcal = kcalMatch ? kcalMatch[1] : null;
      const body = text.replace(/ККАЛ:\s*\d+/i, '').trim();

      document.getElementById('cal-badge').innerHTML = kcal
        ? `<div class="kcal-badge">🔥 ~${kcal} ккал</div>` : '';
      document.getElementById('cal-text').textContent = body;
      document.getElementById('cal-result').style.display = 'block';
    } catch (e) {
      document.getElementById('cal-error').textContent = 'Ошибка: ' + e.message;
      document.getElementById('cal-error').style.display = 'block';
    } finally {
      document.getElementById('cal-loader').style.display = 'none';
      document.getElementById('btn-cal').disabled = false;
    }
  }

  async function getRecipe() {
    const ingredients = document.getElementById('ingredients').value.trim();
    if (!ingredients) return;
    document.getElementById('btn-rec').disabled = true;
    document.getElementById('rec-loader').style.display = 'flex';
    document.getElementById('rec-result').style.display = 'none';
    document.getElementById('rec-error').style.display = 'none';

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'recipe', ingredients })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка сервера');

      document.getElementById('rec-text').textContent = data.text || '';
      document.getElementById('rec-result').style.display = 'block';
    } catch (e) {
      document.getElementById('rec-error').textContent = 'Ошибка: ' + e.message;
      document.getElementById('rec-error').style.display = 'block';
    } finally {
      document.getElementById('rec-loader').style.display = 'none';
      document.getElementById('btn-rec').disabled = false;
    }
  }
</script>
</body>
</html>
